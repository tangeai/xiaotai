## Waveshare ESP32-P4-WIFI6-Touch-LCD-4.3 board support (trimmed).
##
## Derived from waveshare/esp32_p4_wifi6_touch_lcd_4_3 v1.0.1. The LVGL9
## (esp_lv_adapter) glue is intentionally removed: this project drives the
## panel through esp_lvgl_port (LVGL 8.3) in main/drivers/display.
dependencies:
  esp_lcd_st7701: "2.0.2"
  esp_lcd_touch_gt911: "^1.1.1"
  idf: ">=5.4"
description: Trimmed board support for the Waveshare ESP32-P4-WIFI6-Touch-LCD-4.3 (ST7701 MIPI-DSI, GT911 touch)
repository: git://github.com/WaveshareCloud/Waveshare-ESP32-components.git
license: "Apache-2.0"
targets:
  - esp32p4
version: "1.0.1-trimmed"
