<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>开发板资料管理原型</title><link rel="stylesheet" href="admin-prototype.css?v=2"></head><body>
<aside><div class="admin-brand"><i>TC</i><b>ThingConnect</b></div><nav><a>▦ <span>数据概览</span></a><b>♟ <span>业务管理</span><em>⌄</em></b><a>用户管理</a><a>设备管理</a><a class="active">开发板管理</a><b>⚙ <span>服务配置</span><em>›</em></b><b>▣ <span>系统管理</span><em>›</em></b><b>☷ <span>运维管理</span><em>›</em></b></nav></aside>
<div class="workspace"><div class="top"><strong>开发板管理</strong><div class="account"><i>管</i><span>管理员</span><button>⇥ 退出</button></div></div><main><header><div><h1>开发板管理</h1><p>配置官网开发板目录、详情及相关资源</p></div><button id="add" class="primary">＋ 新增开发板</button></header>
<section class="summary"><div><small>已上架</small><b>2</b></div><div><small>草稿</small><b>1</b></div><div><small>适配中</small><b>1</b></div><div><small>容量</small><b>3 / 100</b></div></section>
<section class="panel"><div class="panel-head"><b>全部开发板</b><span>排序前 20 条在官网显示产品图片</span></div><table><thead><tr><th>开发板</th><th>芯片</th><th>适配状态</th><th>顺序</th><th>发布状态</th><th>更新时间</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></section>
</main></div>
<dialog id="editor"><form method="dialog"><div class="dialog-head"><div><h2 id="dialog-title">新增开发板</h2><p>配置官网目录与详情内容</p></div><button value="cancel" class="close" aria-label="关闭">×</button></div><div class="form-body">
<section class="upload"><label for="image"><span id="preview">上传产品图片</span><input id="image" type="file" accept="image/png,image/jpeg,image/webp"></label><small>JPG、PNG、WebP，≤ 5 MB，推荐 4:3</small></section>
<section class="fields"><div class="grid"><label>开发板名称<input id="name" required value="立创·实战派 ESP32-S3"></label><label>完整型号<input id="model" required value="LCKFB-SZPI-ESP32-S3-VA"></label><label>芯片<input id="chip" required value="ESP32-S3"></label><label>厂商<input id="vendor" required value="立创开发板"></label><label>适配状态<select><option>已适配</option><option>适配中</option><option>计划中</option></select></label><label>展示顺序<input type="number" min="1" max="100" value="1"></label></div><label>简单介绍<textarea maxlength="160">2.0 寸触摸屏与完整音频能力，适合 AI 语音聊天、设备互呼及微信语音呼叫。</textarea></label><label>能力标签<input value="语音、触摸屏、H5 画面"></label><div class="resource-title"><b>资源链接</b><span>没有配置的链接不会在官网显示</span></div><div class="grid links"><label>购买链接<input type="url" value="https://lckfb.com/..."></label><label>仓库链接<input type="url" value="https://github.com/tangeai/..."></label><label>固件链接<input type="url" value="https://github.com/tangeai/.../releases"></label><label>烧录指南<input type="url" value="https://github.com/tangeai/.../guide"></label><label class="wide">效果视频链接（可选）<input type="url" placeholder="B站页面地址或自有 HTTPS 视频地址"></label></div><p class="fixed-note">官网购买免责声明由系统统一展示，此处不可编辑。</p></section></div><footer><label class="publish"><input type="checkbox"> 保存后立即上架</label><div><button value="cancel">取消</button><button id="save" value="default" class="primary">保存</button></div></footer></form></dialog>
<script>
const data=[{name:'立创·实战派 ESP32-S3',model:'ESP32-S3-WROOM-1-N16R8 / PCB V1.0.1',chip:'ESP32-S3',adapt:'已适配',order:1,published:true,time:'今天 10:24'},{name:'ESP32-P4-WIFI6-Touch-LCD-4.3',model:'ESP32-P4-WIFI6-Touch-LCD-4.3',chip:'ESP32-P4',adapt:'已适配',order:2,published:true,time:'昨天 18:40'},{name:'示例开发板',model:'BOARD-MODEL-03',chip:'ESP32-S3',adapt:'计划中',order:3,published:false,time:'昨天 16:12'}];const rows=document.querySelector('#rows'),editor=document.querySelector('#editor');function render(){rows.innerHTML=data.map((b,i)=>`<tr><td><b>${b.name}</b><small>${b.model}</small></td><td>${b.chip}</td><td><span class="tag ${b.adapt==='已适配'?'green':b.adapt==='适配中'?'amber':''}">${b.adapt}</span></td><td>${b.order}</td><td><span class="publish-state ${b.published?'on':''}"><i></i>${b.published?'已上架':'草稿'}</span></td><td>${b.time}</td><td><button class="text edit" data-i="${i}">编辑</button><button class="text">${b.published?'下架':'上架'}</button></td></tr>`).join('')}render();document.querySelector('#add').onclick=()=>{document.querySelector('#dialog-title').textContent='新增开发板';editor.showModal()};rows.onclick=e=>{if(!e.target.classList.contains('edit'))return;document.querySelector('#dialog-title').textContent='编辑开发板';const b=data[e.target.dataset.i];document.querySelector('#name').value=b.name;document.querySelector('#model').value=b.model;document.querySelector('#chip').value=b.chip;editor.showModal()};document.querySelector('#image').onchange=e=>{const f=e.target.files[0];if(!f)return;const reader=new FileReader;reader.onload=()=>document.querySelector('#preview').innerHTML=`<img src="${reader.result}" alt="产品图片预览">`;reader.readAsDataURL(f)};document.querySelector('#save').onclick=e=>{e.preventDefault();editor.close()};
</script></body></html>
