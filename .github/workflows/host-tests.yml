name: Host tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: host-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install host test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential libcjson-dev libopus-dev python3 ripgrep

      - name: Check out LVGL 8.3.11 for font lookup tests
        uses: actions/checkout@v7
        with:
          repository: lvgl/lvgl
          ref: 74d0a816a440eea53e030c4f1af842a94f7ce3d3
          path: .tools/lvgl-host-test
          persist-credentials: false

      - name: Run full repository checks
        env:
          XIAOTAI_HOST_LVGL: .tools/lvgl-host-test
        run: bash tools/check.sh
